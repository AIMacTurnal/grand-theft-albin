<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<meta name="robots" content="noindex">
<title>Din present</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0614; --pink:#ff3e9a; --gold:#ffd35a; --cash:#5ee05a}
  *{box-sizing:border-box; margin:0; padding:0}
  body{min-height:100vh; background:var(--ink); color:#fff; font-family:Oswald, system-ui, sans-serif;
    background-image:radial-gradient(circle at 20% 10%, #3a1550 0, transparent 45%), radial-gradient(circle at 80% 70%, #12304f 0, transparent 50%);
    display:flex; flex-direction:column; align-items:center; padding:max(28px,env(safe-area-inset-top)) 16px 40px}
  .gta{font-family:Anton, Impact, sans-serif; text-transform:uppercase; -webkit-text-stroke:2px #000; paint-order:stroke fill; text-shadow:3px 3px 0 #000}
  a.back{align-self:flex-start; color:#ccc; text-decoration:none; font-size:16px; margin-bottom:18px}
  h1{font-size:clamp(44px,13vw,72px); line-height:.9; color:var(--gold); text-align:center}
  .sub{font-family:"Kaushan Script", cursive; font-size:24px; color:var(--pink); text-shadow:2px 2px 0 #000; transform:rotate(-3deg); margin:8px 0 26px}
  .card{width:100%; max-width:440px; background:#fff; color:#000; border:4px solid #000; box-shadow:8px 8px 0 #000; padding:22px 18px}
  .card img.logo{display:block; width:200px; max-width:70%; margin:0 auto 16px}
  label{display:block; font-weight:700; font-size:18px; margin-bottom:8px}
  input{width:100%; font:inherit; font-size:20px; padding:12px; border:3px solid #000; outline:none}
  input:focus{box-shadow:0 0 0 3px var(--pink)}
  button{margin-top:14px; width:100%; font-family:Anton, Impact, sans-serif; font-size:24px; letter-spacing:.04em; padding:12px; color:#fff; background:var(--pink);
    border:3px solid #000; box-shadow:5px 5px 0 #000; cursor:pointer}
  button:active{transform:translate(2px,2px); box-shadow:3px 3px 0 #000}
  button:disabled{opacity:.6}
  .msg{min-height:26px; margin-top:12px; font-weight:700; font-size:17px}
  .msg.err{color:#d0021b}
  .msg.ok{color:#1a8a1a}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  #result{display:none; width:100%; max-width:560px; margin-top:28px; text-align:center}
  #result h2{font-size:clamp(36px,11vw,60px); color:var(--gold)}
  #result img{display:block; width:100%; margin:16px 0; border:4px solid #000; box-shadow:8px 8px 0 var(--pink); background:#fff}
  #result p{font-size:16px; color:#ddd; line-height:1.5}
  #result a{color:var(--gold)}
  #result button{max-width:320px}
</style>
</head>
<body>
  <a class="back" href="./">← Tillbaka</a>
  <h1 class="gta">Din present 🎁</h1>
  <div class="sub">Gokartcity Malmö</div>

  <form class="card" id="form" autocomplete="off">
    <img class="logo" src="img/gokartcity-logo.jpg" alt="Gokartcity Malmö">
    <label for="pw">Lösenord</label>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Skriv lösenordet…" required>
    <button type="submit" id="go">Lås upp</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <section id="result" aria-live="polite">
    <h2 class="gta">Mission passed!</h2>
    <img id="voucher" alt="Presentkort till Gokartcity Malmö: 5 x 8 minuter">
    <button type="button" id="again">⬇ Ladda ner igen</button>
    <p style="margin-top:16px">Boka ditt race på <a href="https://www.gokartcity.se/" target="_blank" rel="noopener">gokartcity.se</a>. Kör försiktigt, Albin.</p>
  </section>

<script>
/* The voucher is stored encrypted (OpenSSL "Salted__" format: AES-256-CBC, key + IV from
   PBKDF2-SHA256, 250 000 iterations). Only the right password can decrypt it, so the image
   is safe even though the repo is public. */
const ITER = 250000;
const form = document.getElementById('form'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
let blobUrl = null;

async function decrypt(password){
  const buf = new Uint8Array(await (await fetch('gift/voucher.bin', {cache:'no-store'})).arrayBuffer());
  const salt = buf.slice(8, 16), data = buf.slice(16);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:ITER}, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const out = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv:bits.slice(32, 48)}, key, data));
  // must be a PNG, otherwise the password was wrong
  if (!(out[0] === 0x89 && out[1] === 0x50 && out[2] === 0x4E && out[3] === 0x47)) throw new Error('bad');
  return new Blob([out], {type:'image/png'});
}

function download(){
  const a = document.createElement('a');
  a.href = blobUrl; a.download = 'gokartcity-presentkort.png';
  document.body.appendChild(a); a.click(); a.remove();
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  go.disabled = true; msg.className = 'msg'; msg.textContent = 'Kollar…';
  try {
    const blob = await decrypt(pw.value.trim().toLowerCase());
    blobUrl = URL.createObjectURL(blob);
    document.getElementById('voucher').src = blobUrl;
    msg.className = 'msg ok'; msg.textContent = 'Rätt! Presentkortet laddas ner…';
    form.style.display = 'none';
    document.getElementById('result').style.display = 'block';
    download();
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'Fel lösenord. Polisen är på väg ★★';
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    pw.select();
  } finally {
    go.disabled = false;
  }
});
document.getElementById('again').addEventListener('click', download);
</script>
</body>
</html>
